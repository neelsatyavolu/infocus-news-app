name: InFocus
options:
  bundleIdPrefix: com.infocuspaly
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: VTQW687WBQ
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  InFocus:
    type: application
    platform: iOS
    sources:
      - path: InFocus
    info:
      path: InFocus/Info.plist
      properties:
        CFBundleDisplayName: InFocus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationQueriesSchemes: [youtube]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Lexend.ttf
          - GeistMono.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Mark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        InFocusPortalURL: https://infocuspaly.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infocuspaly.news
        PRODUCT_NAME: InFocus
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: InFocus/Resources/InFocus-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: InFocus/Resources/InFocus.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: InFocus News App Store

  InFocusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InFocusTests
    dependencies:
      - target: InFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infocuspaly.news.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  InFocus:
    build:
      targets:
        InFocus: all
        InFocusTests: [test]
    test:
      targets: [InFocusTests]
